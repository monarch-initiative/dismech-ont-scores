name: Build and deploy Concept Explorer

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '53 9 * * *'

permissions:
  contents: read

concurrency:
  group: concepts-${{ github.event_name == 'pull_request' && github.ref || 'pages' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        if: github.event_name != 'pull_request'
        with:
          repository: monarch-initiative/dismech
          ref: main
          path: .sources/dismech
          sparse-checkout: |
            kb/disorders
            kb/modules
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.12'
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: uv sync --locked
      - name: Python contracts
        run: uv run pytest -q
      - name: Browser-core contracts
        run: node --test tests/core.test.cjs
      - uses: actions/cache@v4
        if: github.event_name != 'pull_request'
        with:
          path: |
            .cache/vectors.sqlite
            ~/.cache/huggingface
          key: concepts-${{ runner.os }}-${{ hashFiles('uv.lock', 'config/build.json', 'scripts/concept_data.py') }}-${{ github.run_id }}
          restore-keys: |
            concepts-${{ runner.os }}-${{ hashFiles('uv.lock', 'config/build.json', 'scripts/concept_data.py') }}-
      - name: Build current source snapshot
        if: github.event_name != 'pull_request'
        run: uv run python scripts/build_site.py --source .sources/dismech
      - name: Build offline PR fixture
        if: github.event_name == 'pull_request'
        run: uv run python tests/build_fixture.py
      - name: Validate complete artifact
        run: uv run python scripts/build_site.py --validate
      - name: Install browser for smoke tests
        run: uv run playwright install --with-deps chromium
      - name: Test navigation in a real browser
        run: uv run python tests/browser_smoke.py
      - name: Upload validated site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy validated artifact
        id: deployment
        uses: actions/deploy-pages@v4
